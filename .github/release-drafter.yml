name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧪 Tests'
    labels:
      - 'test'
      - 'testing'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: '🔒 Security'
    labels:
      - 'security'
      - 'vulnerability'
  - title: '⚡ Performance'
    labels:
      - 'performance'
      - 'perf'
  - title: '🏗️ Infrastructure'
    labels:
      - 'infrastructure'
      - 'ci'
      - 'deployment'
  - title: '♻️ Refactoring'
    labels:
      - 'refactor'
      - 'refactoring'
  - title: '🧹 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'maintenance'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
# NO `version-resolver:` BLOCK — deliberately removed (spec 076, FR-015).
#
# Release Drafter writes the NOTES here. It does not decide the VERSION. That is computed by
# scripts/release/version.js from the change classification carried on each merged pull request,
# and handed to this action as an explicit `version:` input by .github/workflows/release.yml.
#
# Why: FR-015 requires the notes configuration and the merge gate to agree about what each
# classification means. Two systems that must agree will eventually disagree — this block resolved
# versions from LABELS while the gate resolves them from PR TITLES, so a PR labelled `enhancement`
# with a `fix:` title would have produced two different answers. One authority cannot disagree with
# itself.
#
# If you are here to add a version rule, add it to
# specs/076-monorepo-semantic-versioning/contracts/version-scheme.md and
# scripts/release/classify.js instead.
template: |
  ## What's Changed

  $CHANGES

  ## Contributors

  Thank you to all our contributors! 🎉

  $CONTRIBUTORS
autolabeler:
  - label: 'documentation'
    files:
      - '*.md'
      - 'docs/**/*'
    branch:
      - '/docs{0,1}\/.+/'
  - label: 'bug'
    branch:
      - '/fix\/.+/'
    title:
      - '/fix/i'
  - label: 'enhancement'
    branch:
      - '/feature\/.+/'
      - '/feat\/.+/'
    title:
      - '/feat/i'
      - '/feature/i'
  - label: 'test'
    files:
      - 'test/**/*'
      - '**/*.test.js'
      - '**/*.test.jsx'
  - label: 'ci'
    files:
      - '.github/**/*'
  - label: 'security'
    title:
      - '/security/i'
      - '/vulnerability/i'
      - '/cve/i'
  - label: 'frontend'
    files:
      - 'frontend/**/*'
  - label: 'contracts'
    files:
      - 'contracts/**/*'
