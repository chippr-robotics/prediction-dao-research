name: Branch Policy

# Required, merge-blocking check (spec 076, FR-016/FR-018/FR-019).
#
# `main` is the production branch: everything on it deploys to members. The only two legitimate ways
# for a change to arrive there are a PROMOTION from `staging` (the normal path, where the change has
# already been exercised on a release candidate) and a declared HOTFIX.
#
# Without this check the branch model is convention, which is what it was: nothing prevented a
# feature branch merging straight into `main` and skipping staging entirely.
#
# No `continue-on-error` anywhere below, and none may be added (constitution IV).

# NO `branches:` FILTER on pull_request, deliberately — `test/config/CiGates.test.js` forbids one
# and is right to. A base-branch filter decides whether a workflow RUNS, and the spec-075 lesson is
# that this silently gates stacked work more weakly than a direct PR to main.
#
# This rule genuinely only applies to pull requests into `main`, but that belongs in an `if:` on the
# job, not in the trigger: the workflow then runs everywhere (two git commands — cheap), reports
# honestly on every PR, and the base-branch condition is visible as a condition rather than hidden
# in the event filter.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  schedule:
    # Hotfix drift (FR-019) is a state, not an event — a hotfix can sit on main unmerged for days,
    # so it is checked on a timer as well as at promotion.
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  source-branch:
    name: PRs into main come from staging or a hotfix
    # The base-branch condition lives HERE rather than in the trigger (see the note at the top).
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # BOOTSTRAP. This rule cannot apply before the branch model it enforces exists: `staging` is
      # created as a one-time operational step (spec 076 T032), and until then "come from staging"
      # would block every pull request in the repository — including the one that creates staging.
      #
      # It warns rather than passing silently, so the inactive state is visible rather than looking
      # like a rule that is being satisfied.
      - name: Skip while the branch model is not yet in place
        id: bootstrap
        run: |
          set -euo pipefail
          if git rev-parse -q --verify origin/staging >/dev/null; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::origin/staging does not exist, so the promotion rule is INACTIVE."
            echo "::warning::Create and protect it (docs/runbooks/release-and-promotion.md § One-time"
            echo "::warning::setup, task T032). Until then any branch may merge into main."
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the head branch
        if: steps.bootstrap.outputs.active == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            staging)
              echo "Promotion from staging — the normal path."
              echo "::notice::MERGE THIS WITH A MERGE COMMIT, NOT A SQUASH (spec 076, FR-020/research R6)."
              echo "::notice::Everywhere else in this repo, squash. Here, do not: the release version is"
              echo "::notice::computed from the change classification carried on each commit subject, and"
              echo "::notice::squashing a promotion collapses every PR title in the release into one line."
              echo "::notice::The release would then see a single 'chore' where a 'feat' had shipped." ;;
            hotfix/*)
              echo "::notice::Declared hotfix ($HEAD_REF). It MUST be back-merged into staging after"
              echo "::notice::release, or the next promotion will silently revert it (FR-019)." ;;
            release/*-changelog)
              # THE RELEASE RECORD IS NOT A CHANGE — it is the record OF one.
              #
              # release.yml publishes the tag (immutable, immediate) and then opens a pull request
              # from `release/<version>-changelog` carrying the generated CHANGELOG and manifest
              # versions. The runbook's one-time setup says so explicitly: "the release record
              # arrives as a pull request ... review and merge it; there is nothing to edit."
              #
              # Without this arm, activating the promotion rule makes that PR unmergeable, so the
              # in-repo record can never catch up with the tags — which is exactly the drift that
              # left CHANGELOG.md ten versions behind and lost v1.2.4 entirely. The two halves of
              # spec 076 contradict each other here, and it only becomes visible the moment
              # `staging` exists, because until then this whole job is inert.
              #
              # Safe to admit: the branch is created by release.yml from main itself, its contents
              # are generated rather than authored, and it carries no product change. Promotion is
              # about changes reaching production having first run on staging; a changelog entry
              # describing what already shipped has nothing to run.
              echo "::notice::Generated release record ($HEAD_REF) — not a product change."
              echo "::notice::Contents are generated by release.yml; there is nothing to review but the"
              echo "::notice::accuracy of the record. Merge it, or the in-repo record falls behind the"
              echo "::notice::tags (spec 076, FR-037)." ;;
            *)
              echo "::error::A pull request into main must come from 'staging' or 'hotfix/*'."
              echo "::error::This one comes from '$HEAD_REF'."
              echo "::error::"
              echo "::error::Changes reach production by promotion, so that they have first run on"
              echo "::error::staging (spec 076, FR-018). Retarget this PR at 'staging'; it will reach"
              echo "::error::main with the next promotion."
              echo "::error::"
              echo "::error::If this genuinely cannot wait, rename the branch to 'hotfix/<something>'"
              echo "::error::and be ready to back-merge it into staging."
              exit 1 ;;
          esac

  promotion-config:
    name: staging must mirror production
    # Only a promotion needs this: a hotfix bypasses staging by definition, so comparing the two
    # would be asking a question that has no meaning for it.
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # FR-024/FR-027a: an UNLISTED difference means staging exercised a different configuration,
      # so its green result says nothing about production.
      # FR-026b: networks.js must be untouched — staging reaches both cohorts by being two
      # services, never by loosening the build-time cohort rule.
      - name: Differences must be enumerated, and the cohort boundary untouched
        run: |
          node scripts/release/check-promotion-config.js \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  hotfix-drift:
    name: main must not hold a release staging lacks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Job-scoped, so the other jobs in this file keep the workflow's read-only default. This job
    # needs to point a branch at main's tip (`contents: write`) and open the back-merge PR
    # (`pull-requests: write`).
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Required by approveWorkflowRun below: a pull request this app opens leaves its own required
      # checks stuck in `action_required` until something approves them.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect commits on main that staging does not have
        id: drift
        # No `|| true` and no early `exit 0` — both are forbidden by test/config/CiGates.test.js and
        # both would be wrong here specifically. `git log` failing (an unreadable ref, a bad range)
        # would be swallowed into "no drift", which is a FALSE NEGATIVE in a detector whose entire
        # job is to notice a hotfix that never came back. Under `set -e` a git failure now fails the
        # step, which is the honest outcome: unknown is not the same as clear.
        run: |
          set -euo pipefail
          if git rev-parse -q --verify origin/staging >/dev/null; then
            git log --oneline origin/staging..origin/main > drift.txt
            if [ -s drift.txt ]; then
              echo "drifted=yes" >> "$GITHUB_OUTPUT"
              cat drift.txt
            else
              echo "drifted=no" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::origin/staging does not exist yet — drift detection is inactive (FR-017)."
            echo "drifted=none" >> "$GITHUB_OUTPUT"
          fi

      # Reported as an issue rather than a log line: a hotfix silently absent from staging is
      # reverted by the next promotion, and nobody reads a green workflow's logs.
      - name: Open or update a drift issue
        if: steps.drift.outputs.drifted == 'yes'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const commits = fs.readFileSync('drift.txt', 'utf8').trim()
            const title = 'main contains commits absent from staging'
            const body = [
              'Commits on `main` that `staging` does not have:',
              '',
              '```',
              commits,
              '```',
              '',
              'A hotfix that does not return to `staging` is reverted by the next promotion',
              '(spec 076, FR-019). Back-merge `main` into `staging` to clear this.',
              '',
              'This issue closes itself when the drift is gone.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'release-drift',
            })
            const found = existing.data.find((i) => i.title === title)
            if (found) {
              await github.rest.issues.update({ ...context.repo, issue_number: found.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['release-drift'] })
            }

      # DETECTING THE DRIFT IS NOT THE SAME AS CLEARING IT.
      #
      # The issue above has existed since this job was written, and it worked — it correctly reported
      # that main held three release records staging lacked. It sat open for three days, because
      # filing an issue asks a human to remember a mechanical git operation, and the drift only hurts
      # later, on somebody else's pull request. Measured: it cost #1195 a rebase.
      #
      # So the fix is now prepared as well as reported. This opens the back-merge as a pull request
      # rather than pushing to staging: staging is protected, the merge is worth a human glance, and
      # a PR is reversible where a push is not.
      #
      # The branch is pointed AT MAIN'S TIP, VERBATIM. That is what makes merging it establish real
      # ancestry — a cherry-pick or squash would copy the content and leave `git log staging..main`
      # non-empty, so this job would keep firing while the drift looked fixed.
      - name: Open or refresh the back-merge pull request
        if: steps.drift.outputs.drifted == 'yes'
        uses: actions/github-script@v9
        with:
          script: |
            const branch = 'chore/auto-backmerge-main-into-staging'
            const { data: main } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' })
            const sha = main.commit.sha

            // Idempotent: create the ref, or move an existing one to main's current tip. Forced,
            // because this branch is bot-owned and only ever means "main, right now" — it carries no
            // work of its own that a reset could lose.
            try {
              await github.rest.git.createRef({ ...context.repo, ref: `refs/heads/${branch}`, sha })
              core.notice(`created ${branch} at ${sha.slice(0, 7)}`)
            } catch (err) {
              if (err.status !== 422) throw err
              await github.rest.git.updateRef({ ...context.repo, ref: `heads/${branch}`, sha, force: true })
              core.notice(`moved ${branch} to ${sha.slice(0, 7)}`)
            }

            const open = await github.rest.pulls.list({
              ...context.repo, state: 'open', head: `${context.repo.owner}:${branch}`, base: 'staging',
            })
            if (open.data.length > 0) {
              core.notice(`Back-merge PR already open: #${open.data[0].number} (branch refreshed)`)
              return
            }

            const body = [
              '## ⚠️ MERGE THIS WITH A MERGE COMMIT — NOT A SQUASH',
              '',
              'A squash copies the **content** but not the **ancestry**: `main`\'s commits would still',
              'not be ancestors of `staging`, `git log staging..main` would stay non-empty, and this',
              'pull request would be reopened on the next run while the drift looked fixed.',
              '',
              '## Why this exists',
              '',
              'Release records are born on `main` — the release workflow tags, then opens a',
              '`release/*-changelog` pull request against `main` — so a back-merge is the only route',
              'by which they reach `staging`. The same is true of a `hotfix/*` branch, which merges to',
              '`main` by definition (spec 076, FR-019).',
              '',
              'Left unmerged, the drift does not lose work, but it does two things:',
              '',
              '1. every pull request into `staging` that touches a manifest trips the version gate,',
              '   flagged for bumps its author never made;',
              '2. `staging` reports an older version than the code it is running, so a bug found there',
              '   cannot be traced to a release.',
              '',
              'Opened automatically by `.github/workflows/branch-policy.yml`. The branch points at',
              `\`main\` verbatim (${sha.slice(0, 7)}) and is refreshed on each run.`,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n')

            const { data: pr } = await github.rest.pulls.create({
              ...context.repo,
              title: 'chore: back-merge main into staging (clears release drift)',
              head: branch,
              base: 'staging',
              body,
            })
            core.notice(`Opened back-merge PR #${pr.number}`)

            /*
             * A PULL REQUEST OPENED BY GITHUB-ACTIONS CANNOT SATISFY ITS OWN REQUIRED CHECKS.
             *
             * Workflow runs triggered by a pull request that this app opened land in
             * `action_required` — awaiting a human clicking "Approve and run". `staging` requires
             * `Change classification` and `Mini-app version pairing`, so until somebody approves,
             * those two never report and the pull request is BLOCKED. Measured on #1206: 36 checks
             * green, the two required ones absent entirely, mergeStateStatus BLOCKED.
             *
             * That defeats the point of opening it. The whole reason this job creates a pull request
             * rather than filing an issue is that a mechanical step nobody is required to do does not
             * get done — and "go approve seven workflow runs" is exactly such a step.
             *
             * So it approves them itself. The runs being approved are on a branch this job just
             * created, pointing at `main` VERBATIM, in this repository. No untrusted contributor code
             * is involved, which is the risk the approval gate exists to manage.
             */
            const { data: pending } = await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo, branch, status: 'action_required', per_page: 50,
            })
            for (const run of pending.workflow_runs ?? []) {
              try {
                await github.rest.actions.approveWorkflowRun({ ...context.repo, run_id: run.id })
                core.notice(`approved ${run.name} (${run.id})`)
              } catch (err) {
                // Non-fatal. The pull request still exists and a human can approve it; losing the
                // convenience must never lose the pull request.
                core.warning(`could not approve ${run.name}: ${err.message}`)
              }
            }

      - name: Close the drift issue once clear
        if: steps.drift.outputs.drifted == 'no'
        uses: actions/github-script@v9
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'release-drift',
            })
            for (const issue of existing.data) {
              if (issue.title !== 'main contains commits absent from staging') continue
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: 'Drift cleared — `staging` now contains everything on `main`.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_',
              })
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
              })
            }
