name: CI Manager - Smart Test Selection

on:
  # EVERY pull request, whatever it targets.
  #
  # This was `branches: [main, develop]`, so a PR into any other branch ran NOTHING here — and
  # this is the workflow that dispatches test.yml and security-testing.yml, i.e. all of them.
  # Stacked PRs are the normal shape of work in this repo (a feature branch collecting fixes
  # before one merge to main), and every one of those forks was merging on the strength of
  # Release Drafter alone. #1018 merged that way: mergeStateStatus CLEAN, zero tests run.
  #
  # The base branch is not what decides whether code should be tested. Path filters already keep
  # the cost proportional — that is this workflow's entire job — so running it everywhere is
  # cheap. `push` stays scoped: the pull_request event is the gate.
  pull_request:
    # `ready_for_review` matters: the default types are opened/synchronize/reopened, so with the
    # draft guard below a PR marked ready would otherwise never get a pipeline at all.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

# Supersede in-flight runs for the same ref (spec 075, FR-010). Without this, pushing a
# follow-up commit leaves the previous pipeline running to completion, which is where a large
# share of this repo's runner time went.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    # DRAFT PRs DO NOT RUN CI. GitHub runs workflows on drafts unless a job says otherwise, so
    # every push to a work-in-progress branch was running the full pipeline — 11 artifact uploads
    # per run — and the artifact API began rate-limiting. Every other job `needs` this one, so
    # skipping here skips the pipeline. `github.event.pull_request` is null on push, and
    # `null != true` is true, so pushes to main/develop are unaffected.
    if: github.event.pull_request.draft != true
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      security: ${{ steps.filter.outputs.security }}
      core: ${{ steps.filter.outputs.core }}
      services: ${{ steps.filter.outputs.services }}
      packages: ${{ steps.filter.outputs.packages }}
      tenants: ${{ steps.filter.outputs.tenants }}
      tooling: ${{ steps.filter.outputs.tooling }}
      subgraph: ${{ steps.filter.outputs.subgraph }}
      ops: ${{ steps.filter.outputs.ops }}
      any_code_changed: ${{ steps.check.outputs.any_code_changed }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - 'hardhat.config.js'
              # `scripts/deploy*.js` did NOT match scripts/deploy/lib/upgradeable.js (the in-place
              # upgrade path) or scripts/deploy/check-storage-layout.js (the gate itself).
              - 'scripts/deploy/**'
              - 'test/*.test.js'
              - 'test/integration/**'
              - 'medusa.json'
              - 'slither.config.json'
            frontend:
              - 'frontend/**'
              - '!frontend/README.md'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'requirements.txt'
              - '*.md'
              - '!frontend/README.md'
            security:
              - 'contracts/**'
              - 'hardhat.config.js'
              - 'test/**'
              - 'medusa.json'
              - 'slither.config.json'
            core:
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'turbo.json'
            # Directories below matched NO filter at all before spec 075. A PR touching only one of
            # them ran zero jobs and merged green — and now that these checks are REQUIRED, they
            # would report `skipped`, which SATISFIES a required check. Requiring checks made that
            # hole quieter, not smaller.
            services:
              - 'services/**'
            packages:
              - 'packages/**'
              - 'tools/**'
            tenants:
              - 'tenants/**'
            tooling:
              - 'scripts/**'
              - 'test/**'
            subgraph:
              - 'subgraph/**'
            ops:
              - 'deployments/**'
              - 'infra/**'
              - 'ops/**'
              - '.openzeppelin/**'

      - name: Check if any code changed
        id: check
        run: |
          if [[ "${{ steps.filter.outputs.contracts }}" == "true" || \
                "${{ steps.filter.outputs.frontend }}" == "true" || \
                "${{ steps.filter.outputs.core }}" == "true" ]]; then
            echo "any_code_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_code_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate change summary
        run: |
          set -eo pipefail
          
          # Set default values for outputs to ensure they're always defined
          contracts="${{ steps.filter.outputs.contracts }}"
          frontend="${{ steps.filter.outputs.frontend }}"
          docs="${{ steps.filter.outputs.docs }}"
          security="${{ steps.filter.outputs.security }}"
          
          # Ensure variables default to 'false' if empty
          contracts="${contracts:-false}"
          frontend="${frontend:-false}"
          docs="${docs:-false}"
          security="${security:-false}"
          
          echo "## 🔍 Change Detection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow intelligently detects which components have changed" >> $GITHUB_STEP_SUMMARY
          echo "and runs only the necessary tests to save CI time and resources." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Components Changed:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "$contracts" == "true" ]]; then
            echo "✅ **Smart Contracts** - Will run contract tests" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **Smart Contracts** - No changes detected, tests skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "$frontend" == "true" ]]; then
            echo "✅ **Frontend** - Will run frontend tests" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **Frontend** - No changes detected, tests skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "$docs" == "true" ]]; then
            echo "✅ **Documentation** - Will build docs" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **Documentation** - No changes detected, build skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "$security" == "true" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "✅ **Security Testing** - Will run security analysis" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **Security Testing** - No changes detected, analysis skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tests to Execute:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          test_count=0
          if [[ "$contracts" == "true" ]]; then
            echo "- Smart Contract Tests" >> $GITHUB_STEP_SUMMARY
            test_count=$((test_count + 1))
          fi
          if [[ "$frontend" == "true" ]]; then
            echo "- Frontend Lint & Build" >> $GITHUB_STEP_SUMMARY
            test_count=$((test_count + 1))
          fi
          if [[ "$docs" == "true" ]]; then
            echo "- Documentation Build" >> $GITHUB_STEP_SUMMARY
            test_count=$((test_count + 1))
          fi
          if [[ "$security" == "true" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "- Security Analysis" >> $GITHUB_STEP_SUMMARY
            test_count=$((test_count + 1))
          fi
          
          if [[ $test_count -eq 0 ]]; then
            echo "- None (Documentation-only changes)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total test suites to run:** $test_count" >> $GITHUB_STEP_SUMMARY

  smart-contract-tests:
    name: Smart Contract Tests
    needs: detect-changes
    # test.yml is the workhorse: it owns Dependency Hygiene, Relay Gateway Tests, Tenant Manifest
    # Validation, Frontend Lint/Unit/Build and Cypress Fast E2E — i.e. most of the REQUIRED checks.
    # Gating it on contracts||core meant a services-, packages-, tenants-, scripts- or
    # subgraph-only PR skipped every one of them.
    if: |
      needs.detect-changes.outputs.contracts == 'true' ||
      needs.detect-changes.outputs.core == 'true' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.services == 'true' ||
      needs.detect-changes.outputs.packages == 'true' ||
      needs.detect-changes.outputs.tenants == 'true' ||
      needs.detect-changes.outputs.tooling == 'true' ||
      needs.detect-changes.outputs.subgraph == 'true' ||
      needs.detect-changes.outputs.ops == 'true'
    uses: ./.github/workflows/test.yml

  frontend-tests:
    name: Frontend Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      - name: Install frontend dependencies
        run: npm ci --workspace frontend --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build

      # No dist/ upload: nothing downloads it, and the gate is `npm run build` exiting 0.

  docs-build:
    name: Documentation Build
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build

      # No site upload: this job exists to prove `mkdocs build` succeeds. The published
      # docs come from deploy-docs.yml, which rebuilds from source and uses
      # upload-pages-artifact — it never reads this one. At 9.4 MB it was the single
      # largest per-push artifact after the Cypress videos.

  security-analysis:
    name: Security Analysis
    needs: detect-changes
    # Run on main branch or when security-relevant files changed
    if: |
      github.ref == 'refs/heads/main' ||
      needs.detect-changes.outputs.security == 'true'
    uses: ./.github/workflows/security-testing.yml

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: 
      - detect-changes
      - smart-contract-tests
      - frontend-tests
      - docs-build
      - security-analysis
    if: always()
    
    steps:
      - name: Generate final summary
        run: |
          echo "## 🎉 CI Manager Execution Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Reason |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Smart Contract Tests
          if [[ "${{ needs.smart-contract-tests.result }}" == "success" ]]; then
            echo "| Smart Contract Tests | ✅ Success | Tests passed |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.smart-contract-tests.result }}" == "skipped" ]]; then
            echo "| Smart Contract Tests | ⏭️ Skipped | No contract changes detected |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.smart-contract-tests.result }}" == "failure" ]]; then
            echo "| Smart Contract Tests | ❌ Failed | Tests failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Frontend Tests
          if [[ "${{ needs.frontend-tests.result }}" == "success" ]]; then
            echo "| Frontend Tests | ✅ Success | Tests passed |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.frontend-tests.result }}" == "skipped" ]]; then
            echo "| Frontend Tests | ⏭️ Skipped | No frontend changes detected |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.frontend-tests.result }}" == "failure" ]]; then
            echo "| Frontend Tests | ❌ Failed | Tests failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Docs Build
          if [[ "${{ needs.docs-build.result }}" == "success" ]]; then
            echo "| Documentation Build | ✅ Success | Build completed |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.docs-build.result }}" == "skipped" ]]; then
            echo "| Documentation Build | ⏭️ Skipped | No doc changes detected |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.docs-build.result }}" == "failure" ]]; then
            echo "| Documentation Build | ❌ Failed | Build failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Security Analysis
          if [[ "${{ needs.security-analysis.result }}" == "success" ]]; then
            echo "| Security Analysis | ✅ Success | Analysis completed |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.security-analysis.result }}" == "skipped" ]]; then
            echo "| Security Analysis | ⏭️ Skipped | No security changes detected |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.security-analysis.result }}" == "failure" ]]; then
            echo "| Security Analysis | ❌ Failed | Analysis found issues |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **Tip:** This CI Manager optimizes test execution by only running tests" >> $GITHUB_STEP_SUMMARY
          echo "for components that have changed. This saves time and resources!" >> $GITHUB_STEP_SUMMARY

      - name: Check overall status
        run: |
          if [[ "${{ needs.smart-contract-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.docs-build.result }}" == "failure" ]] || \
             [[ "${{ needs.security-analysis.result }}" == "failure" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs completed successfully"
