name: Staging Candidate

# Every merge into `staging` becomes a release candidate (spec 076, FR-002).
#
# It does NOT deploy. The staging Cloud Run services build from this branch themselves; this
# workflow's whole job is to give that revision a candidate NUMBER, so what is running on staging
# and what will be released from `main` are described by the same authority.
#
# The candidate number comes from scripts/release/version.js — the same authority that computes
# production versions, so a candidate and the release it becomes cannot disagree.
#
# Note the candidate BASE is recomputed on every merge: a candidate that was v1.3.1-rc.1 becomes
# v1.4.0-rc.2 when a `feat` lands. The base tracks the accumulated classification rather than the
# first guess.

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  # One candidate at a time. Two concurrent runs would race for the same -rc.N tag.
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  candidate:
    name: Tag a release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compute the release candidate
        id: rc
        run: |
          set -euo pipefail
          node scripts/release/version.js --rc --explain | tee rc-explain.txt
          RC=$(node scripts/release/version.js --rc)
          if [ -z "$RC" ] || [ "$RC" = "undefined" ]; then
            echo "::notice::Nothing to deploy: no classified commits since the last release."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=$RC" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Release candidate"
            echo ""
            echo '```'
            cat rc-explain.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the candidate
        if: steps.rc.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.rc.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::candidate tag $TAG already exists — candidates are immutable too."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release candidate $TAG"
          git push origin "$TAG"

      # DEPLOYMENT IS NOT DONE HERE. The staging Cloud Run services build from this branch
      # themselves, so a second pipeline pushing images at the same revision would be a second
      # source of truth about what staging is running.
      #
      # This step used to submit cloudbuild.staging.yaml. It never once succeeded: the runs that
      # reached it failed on `The required property [project] is not currently set` (no auth, no
      # project — the one-time grant it depended on was never made), and the runs that were green
      # had SKIPPED it. So every merge into `staging` since 2026-08-11T00:14 was marked red by a
      # step that had never worked, which is worse than having no step at all: a red that is always
      # red carries no information, and the genuinely stale staging service hid behind it.
      - name: Say where the deploy happens
        if: steps.rc.outputs.proceed == 'true'
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "Tagged \`${{ steps.rc.outputs.version }}\`. The staging Cloud Run services deploy"
            echo "themselves from this branch — nothing is submitted from CI."
            echo ""
            echo "If a staging host is not serving this commit, the service's own build is the"
            echo "place to look, not this run. See docs/runbooks/release-and-promotion.md."
          } >> "$GITHUB_STEP_SUMMARY"
