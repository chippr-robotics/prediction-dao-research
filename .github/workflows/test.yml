name: Test Pipeline

on:
  # pull_request/push triggers deliberately REMOVED (spec 075, FR-009).
  # ci-manager.yml invokes this workflow via workflow_call; declaring event triggers here
  # as well made it run TWICE per commit, which is why ci-manager's change detection only
  # ever ADDED work instead of reducing it.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # Gate (spec 072, FR-008): every tenants/<id>/manifest.json must be valid —
  # structure, domain uniqueness, fee caps, cohort separation, dedicated-mode
  # record presence. Must fail the pipeline loudly (Constitution IV). The
  # validator is dependency-free, so no npm ci is needed.
  tenant-manifests:
    name: Tenant Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate tenant manifests
        run: node scripts/tenants/validate-tenant-manifest.js

  # The release tooling decides what ships and under what number. It had a test suite and no
  # workflow ran it, so it was a suite in the same sense a fire alarm with no battery is an alarm:
  # `scripts/release/__tests__` was green locally while the train on `main` released its own
  # CHANGELOG commits three times (v1.5.5 -> v1.5.6 -> v1.5.7, no product change in any of them).
  # Dependency-free — node:test and git only, so no npm ci.
  release-tooling:
    name: Release Tooling Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # version.js reads tags and commit ranges; a shallow clone makes it answer a different
          # question rather than fail, which is the failure mode its own comments warn about.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run release tooling tests
        run: npm run test:release

      # The Pinata pinning client that replaced `@pinata/sdk`. Stubs `fetch`, so it needs no
      # credentials and no network — which is why it belongs in this dependency-free job.
      - name: Run market-template tooling tests
        run: npm run test:market-templates

  # Gate (spec 075, FR-003/FR-015): version skew across manifests and undeclared (phantom)
  # imports. Both invariants were fixed by hand once and had nothing preventing recurrence, which
  # is precisely the failure mode spec 075 exists to remove. Dependency-free, so no npm ci.
  dependency-hygiene:
    name: Dependency Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check dependency hygiene
        run: npm run check:deps

  # Gate (spec 089, FR-019…FR-023): a revenue or cost source that reaches production without a
  # dashboard entry is money moving that nobody is watching. The brief stated updating the dashboard
  # as a MUST; every comparable invariant in this repo that survived was made a gate, because a prose
  # rule with no enforcement is the one rule that gets broken.
  #
  # Dependency-free (the catalogue has zero runtime deps), so no npm ci — same reasoning as the job
  # above. Must fail loudly; do NOT add continue-on-error (Constitution IV).
  finops-coverage:
    name: FinOps Dashboard Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check FinOps source coverage
        run: npm run check:finops

  smart-contract-tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Resilient solc fetch + compile (cache the pinned compiler, retry stalled
      # downloads). Replaces a bare `npm run compile`, which hangs indefinitely
      # when binaries.soliditylang.org stalls.
      - name: Compile contracts
        uses: ./.github/actions/setup-hardhat-solc

      # Gate (spec 025, FR-010/SC-005): block a storage-incompatible / upgrade-unsafe implementation BEFORE
      # it can ship. Must fail the pipeline loudly — do NOT add continue-on-error (Constitution IV).
      - name: Check upgradeable storage layout
        run: npm run check:storage-layout

      # Gate (spec 075, FR-032): the committed ABIs must match the compiled contracts. The proxies
      # are upgraded IN PLACE at stable addresses, so a stale ABI desynchronises the app and the
      # subgraph from the chain with no address change to notice. Must fail loudly (constitution IV).
      - name: Check generated ABIs are current
        run: npm run check:abis

      # Gate (spec 075, FR-005). plan.md describes this feature as "gated on a byte-for-byte
      # bytecode diff that BLOCKS the change on any difference" — but the script was referenced
      # nowhere except a comment in dependabot.yml, so it blocked nothing and was a tool someone
      # had to remember to run. This is the step that makes the sentence true.
      #
      # It is the only automated defence against the incident that motivated the pin: a floating
      # @chainlink/contracts (1.3.0 -> 1.5.0) silently changed ChainlinkFunctionsOracleAdapter's
      # deployed bytecode with every other gate green, because CompilerTargets only checks the
      # SHAPE of a version range, not the bytes that come out. Runs directly after Compile so the
      # artifacts it hashes are this run's.
      - name: Bytecode is byte-identical to the recorded baseline
        run: node scripts/codegen/bytecode-digest.js --compare specs/075-monorepo-workspaces/baseline-bytecode.json

      # spec 075 FR-041: exercise the task graph with caching DISABLED. Turborepo does not sandbox,
      # so an undeclared input yields a wrong cache hit rather than an error; the cache is not
      # trusted in CI until the graph has been observed to reproduce this pipeline's outcomes.
      # Lives in THIS job because //#check:abis depends on //#compile — the dependency-hygiene job
      # deliberately installs nothing.
      - name: Root gates via the task graph (cache disabled)
        run: npx turbo run check:abis tenants:validate --force

      - name: Run tests
        # `set -o pipefail` is REQUIRED: piping into `tee` otherwise makes the step's exit
        # status tee's (always 0), silently discarding this gate's failures (spec 075).
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Summarize test results
        if: always()
        run: |
          echo "### Smart Contract Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if grep -q "passing" test-output.txt; then
            PASSING=$(grep -oP '\d+ passing' test-output.txt | head -1)
            PENDING=$(grep -oP '\d+ pending' test-output.txt | head -1 || echo "0 pending")
            FAILING=$(grep -oP '\d+ failing' test-output.txt | head -1 || echo "")
            DURATION=$(grep -oP '\(\d+[ms]+\)' test-output.txt | tail -1 || echo "")

            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passing | $PASSING |" >> $GITHUB_STEP_SUMMARY
            [ -n "$PENDING" ] && echo "| Pending | $PENDING |" >> $GITHUB_STEP_SUMMARY
            [ -n "$FAILING" ] && echo "| Failing | $FAILING |" >> $GITHUB_STEP_SUMMARY
            [ -n "$DURATION" ] && echo "| Duration | $DURATION |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Could not parse test output" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # Contract coverage is a first-class gate (spec 046): it MUST fail the pipeline
      # loudly (Constitution IV) — no continue-on-error. The run emits
      # coverage/coverage-summary.json (istanbul json-summary via .solcover.js).
      - name: Generate coverage report
        run: npm run test:coverage

      - name: Summarize coverage
        if: always()
        run: |
          if [ -f "coverage/coverage-summary.json" ]; then
            echo "### Contract Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Extract top-level coverage percentages
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              console.log('Statements: ' + c.statements.pct + '%');
              console.log('Branches:   ' + c.branches.pct + '%');
              console.log('Functions:  ' + c.functions.pct + '%');
              console.log('Lines:      ' + c.lines.pct + '%');
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

      # Blocking gate: fail the PR if any security-critical contract falls below its
      # tier in coverage-threshold-policy.json (spec 046, FR-011). Report-only
      # contracts never fail the gate.
      - name: Enforce coverage thresholds (security-critical gate)
        run: node scripts/coverage/check-thresholds.js --summary coverage/coverage-summary.json --policy coverage-threshold-policy.json --scope gated

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contracts-coverage-report
          path: coverage/
          # 7, not 30. The repo is private, so artifacts draw on the account storage
          # quota (public repos get it free) — 30-day retention at this push rate is
          # what exhausted it and failed every job on upload. Coverage numbers land in
          # the step summary above; the HTML is only read same-day, if ever.
          retention-days: 7

  # Gate (spec 075, FR-019/FR-020/B2). Mini-app output bytes are keccak-committed on-chain in
  # MiniAppRegistry, and the chain of custody is:
  #   npm hoisting -> module resolution -> host shim text -> entry.js -> manifest hash -> on-chain
  # A change to installation layout can therefore invalidate an immutable, curated, on-chain record
  # with no error raised anywhere. This gate existed as a script but appeared in NO workflow — it
  # was a manual checklist item, for the one guarantee in this repo that cannot be re-checked after
  # the fact.
  miniapp-bytes:
    name: Mini-app Output Bytes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      # `--since` stamped BEFORE the build, and `&&` so a failed build can never reach the
      # compare. Both matter: the compare used to accept any dist/ younger than 10 minutes, so a
      # build that FAILED left the previous successful output in place and the gate printed
      # "output bytes unchanged" — the exact false pass its own source comment describes, which
      # happened once already when rollup's native binary went missing during this conversion.
      - name: Build mini-apps and compare output bytes
        run: |
          set -euo pipefail
          STAMP=$(($(date +%s) * 1000))
          # Explicit `&&`, and explicit `-e`. The comment above claims the compare cannot be
          # reached by a failed build, so the code must say that rather than lean on the runner's
          # default `bash -e {0}` — a `shell:` override, or someone copying this block elsewhere,
          # would silently turn the claim false. Relying on implicit shell behaviour for a gate's
          # blocking property is how the tee'd steps in this repo lost their exit codes.
          #
          # KEEP THIS COMPOUND LAST. `set -e` deliberately does NOT fire on a failing left-hand
          # side of `&&`, so the build's failure reaches the step only as the compound's own exit
          # status. Verified: with a trailing command after it, a failed build yields step exit 0.
          npm run build:miniapps && node scripts/miniapps/record-build-digests.js \
            --compare specs/075-monorepo-workspaces/baseline-miniapp-builds.json \
            --since "$STAMP"

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      - name: Install frontend dependencies
        run: npm ci --workspace frontend --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      # IMPORTANT: Linting errors must fail the build to prevent code quality regressions.
      # Do not add 'continue-on-error: true' to this step as it would hide ESLint failures.
      - name: Run linter
        # `set -o pipefail` is REQUIRED: piping into `tee` otherwise makes the step's exit
        # status tee's (always 0), silently discarding this gate's failures (spec 075).
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.txt

      - name: Summarize lint results
        if: always()
        run: |
          echo "### Frontend Lint" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          WARNINGS=$(grep -c "warning" lint-output.txt 2>/dev/null || echo "0")
          ERRORS=$(grep -c "error" lint-output.txt 2>/dev/null || echo "0")
          if [ "$ERRORS" = "0" ] && [ "$WARNINGS" = "0" ]; then
            echo "✅ No lint issues found" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Type | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
            echo "| Warnings | $WARNINGS |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

  # Relay-gateway service tests (specs 035/036/050 + the spec-055 OpenSea proxy).
  # Gating like every other test job — no continue-on-error (Constitution IV).
  relay-gateway-tests:
    name: Relay Gateway Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/relay-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      - name: Install gateway dependencies
        run: npm ci --workspace fairwins-relay-gateway --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      - name: Run tests
        run: npm test

  # FinOps exporter tests (spec 089). The honesty suite is the load-bearing one: it asserts that a
  # source which could not be read never renders as a zero, in any state, under any failure mode.
  # Gating like every other test job — no continue-on-error (Constitution IV).
  finops-exporter-tests:
    name: FinOps Exporter Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/finops-exporter

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      - name: Install exporter dependencies
        run: npm ci --workspace fairwins-finops-exporter --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      - name: Run tests
        run: npm test

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      - name: Install frontend dependencies
        run: npm ci --workspace frontend --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      - name: Run tests
        # `set -o pipefail` is REQUIRED: piping into `tee` otherwise makes the step's exit
        # status tee's (always 0), silently discarding this gate's failures (spec 075).
        run: |
          set -o pipefail
          npm test -- --run --reporter=verbose 2>&1 | tee test-output.txt
        env:
          # Parity with frontend-testing.yml, which runs the IDENTICAL suite (spec 075, T027).
          # Without the heap bump the full suite OOMs; TZ is pinned because several suites
          # hard-code UTC datetime strings and would pass or fail on the runner's locale.
          NODE_OPTIONS: --max-old-space-size=4096
          TZ: UTC

      - name: Summarize test results
        if: always()
        run: |
          echo "### Frontend Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Parse Vitest output
          FILES=$(grep -oP '\d+ passed' test-output.txt | tail -1 || echo "")
          TESTS_LINE=$(grep "Tests" test-output.txt | tail -1 || echo "")
          DURATION_LINE=$(grep "Duration" test-output.txt | tail -1 || echo "")

          if [ -n "$TESTS_LINE" ]; then
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| $TESTS_LINE |" | sed 's/^/| Tests | /' >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            echo "| Duration | $DURATION_LINE |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # Coverage report generation can fail due to environment issues without indicating
      # actual test failures. We allow this to fail gracefully while still uploading
      # whatever coverage data was generated.
      - name: Generate coverage report
        # `set -o pipefail` is REQUIRED: piping into `tee` otherwise makes the step's exit
        # status tee's (always 0), silently discarding this gate's failures (spec 075).
        run: |
          set -o pipefail
          npm run test:coverage -- --run 2>&1 | tee coverage-output.txt
        continue-on-error: true

      - name: Summarize coverage
        if: always()
        run: |
          echo "### Frontend Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "coverage/coverage-summary.json" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              console.log('Statements: ' + c.statements.pct + '%');
              console.log('Branches:   ' + c.branches.pct + '%');
              console.log('Functions:  ' + c.functions.pct + '%');
              console.log('Lines:      ' + c.lines.pct + '%');
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            # Fall back to parsing text output
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A5 "^-\|^All files\|^%" coverage-output.txt | head -10 >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-test-coverage
          path: frontend/coverage/
          retention-days: 7

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      - name: Install frontend dependencies
        run: npm ci --workspace frontend --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      - name: Build frontend
        run: npm run build

      - name: Summarize build output
        if: always()
        run: |
          echo "### Frontend Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "dist" ]; then
            TOTAL_SIZE=$(du -sh dist | cut -f1)
            JS_SIZE=$(find dist -name "*.js" -exec du -ch {} + 2>/dev/null | tail -1 | cut -f1 || echo "n/a")
            CSS_SIZE=$(find dist -name "*.css" -exec du -ch {} + 2>/dev/null | tail -1 | cut -f1 || echo "n/a")
            FILE_COUNT=$(find dist -type f | wc -l)
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total size | $TOTAL_SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| JS bundle | $JS_SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| CSS bundle | $CSS_SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| Files | $FILE_COUNT |" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed — no dist directory" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # No dist/ upload. Nothing downloads it — the gate is `npm run build` exiting 0,
      # and the step summary above already reports bundle sizes and file count. Uploading
      # 2.5 MB of unread bytes on every push is pure quota burn on a private repo.

  cypress-fast-e2e:
    # Spec 094: one leg per viewport profile. Responsive behaviour needs no chain, so this is where
    # it belongs — admission rule 1 forbids spending on-chain-tier wall clock proving a control is
    # reachable at 390px. `desktop` is 1280×720, exactly what every existing spec was written
    # against, so that leg is a no-op change and any diff in it is a real regression.
    name: Cypress Fast E2E (${{ matrix.viewport }})
    runs-on: ubuntu-latest

    strategy:
      # Both legs always run: a phone-only failure is information, not a reason to stop measuring
      # the desktop one.
      fail-fast: false
      matrix:
        viewport: [desktop, phone]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      - name: Install frontend dependencies
        run: npm ci --workspace frontend --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      # Constitution IV: this step MUST fail the pipeline on error. Do NOT reintroduce
      # `continue-on-error` here (spec 075, FR-007/FR-008).
      #
      # `set -o pipefail` is load-bearing: the command is piped into `tee`, so without it the
      # step's exit status is tee's (always 0) and cypress's failure is discarded exactly as
      # `continue-on-error` used to discard it.
      # Only the NO-CHAIN tier is doubled. The account-native (passkey) tier rides this job for its
      # runner, not because it is a viewport question: it drives the WebAuthn harness, its budget is
      # a single sub-5-minute run, and running it twice would contradict the policy this feature
      # just wrote down. It goes in the desktop leg — the width every one of its specs was authored
      # against.
      - name: Select this leg's specs
        id: specs
        run: |
          if [ "${{ matrix.viewport }}" = "desktop" ]; then
            echo 'specs=cypress/e2e/fast/**/*.cy.js,cypress/e2e/passkey/**/*.cy.js' >> $GITHUB_OUTPUT
          else
            echo 'specs=cypress/e2e/fast/**/*.cy.js' >> $GITHUB_OUTPUT
          fi

      - name: Run fast E2E tests
        env:
          # Read by cypress/support/viewports.js and applied from a global beforeEach, so a spec
          # written tomorrow is covered at both widths without its author doing anything.
          CYPRESS_VIEWPORT_PROFILE: ${{ matrix.viewport }}
        run: |
          set -o pipefail
          npx start-server-and-test dev http://localhost:5173 'cypress run --spec "${{ steps.specs.outputs.specs }}" --reporter json --reporter-options "output=cypress-results.json"' 2>&1 | tee cypress-output.txt

      - name: Summarize E2E results
        if: always()
        run: |
          echo "### Cypress Fast E2E (${{ matrix.viewport }} viewport)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Parse the RUN-TOTAL row of Cypress's own summary table. The previous version preferred
          # cypress-results.json, which Cypress never writes (see `Check E2E results`), and its
          # fallback grepped the first `N passing` line — i.e. spec #1's tally reported as if it
          # were the whole run.
          #
          # The totals row is the last line matching "All specs passed!" or "N of M failed", with
          # columns: <label> <duration> <tests> <passing> <failing> <pending> <skipped>.
          sed -e 's/\x1b\[[0-9;]*m//g' cypress-output.txt > cypress-plain.txt
          TOTALS=$(grep -E "(All specs passed!|[0-9]+ of [0-9]+ failed)" cypress-plain.txt | tail -1)
          if [ -n "$TOTALS" ]; then
            # Strip box-drawing characters, then take the trailing numeric columns.
            NUMS=$(echo "$TOTALS" | tr -d '│┌┐└┘─' | sed 's/[✔✖]//g' | grep -oE '[0-9]+|-' | tail -5 | tr '\n' ' ')
            set -- $NUMS
            # Cypress prints "-" for a zero column, so normalise it rather than rendering "-".
            z () { [ "${1:-}" = "-" ] || [ -z "${1:-}" ] && echo 0 || echo "$1"; }
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Tests | ${1:-?} |" >> $GITHUB_STEP_SUMMARY
            echo "| Passing | $(z "${2:-}") |" >> $GITHUB_STEP_SUMMARY
            echo "| Failing | $(z "${3:-}") |" >> $GITHUB_STEP_SUMMARY
            echo "| Pending | $(z "${4:-}") |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`$(echo "$TOTALS" | tr -d '│' | xargs)\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Cypress produced no run-total row — see the job log." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # Belt-and-braces assertion on the machine-readable results (spec 075, FR-008).
      #
      # This replaces `grep -q "failing" cypress-output.txt`, which could never match: the run uses
      # `--reporter json`, so that file holds JSON, and mocha's JSON reporter emits `"failures": N`
      # — never the word "failing". Combined with the `continue-on-error` above, the gate reported
      # success on every run regardless of how many tests failed.
      #
      # A missing results file is also a failure: a crashed or never-started run must not pass.
      - name: Check E2E results
        if: always()
        run: |
          # This gate used to require cypress-results.json. Cypress NEVER WRITES THAT FILE:
          # `--reporter json --reporter-options "output=..."` emits the JSON to stdout and the
          # option is ignored (verified directly — a passing single-spec run exits 0 and leaves no
          # file). So spec 075 swapped an always-green gate for an always-RED one: this step could
          # not pass even with every test green, which is the same defect wearing the other face.
          # There is also no aggregate to write — the json reporter emits one object PER SPEC.
          #
          # The authoritative pass/fail is cypress's EXIT CODE, which is non-zero iff tests failed
          # and which `set -o pipefail` on the run step now preserves. What that exit code cannot
          # tell us is whether the run died before executing anything, so that is what this checks.
          #
          # EVERY MATCH BELOW RUNS ON THE DE-COLOURED COPY. Cypress writes
          # `(<esc>[4m<esc>[1mRun Finished<esc>[22m<esc>[24m)`, so the literal "(Run Finished)"
          # does not occur in the raw file, and the totals row's ✖ is wrapped in codes too.
          # Grepping the raw output for either is the same mistake as the original gate grepping
          # "failing" against a reporter that only ever emits "failures" — a check that cannot fire.
          sed -e 's/\x1b\[[0-9;]*m//g' cypress-output.txt > cypress-plain.txt

          if ! grep -qE "Run Finished" cypress-plain.txt; then
            echo "::error::Cypress never reached 'Run Finished' — the run died before completing. Failing rather than assuming success."
            exit 1
          fi

          # Cross-check the reported totals. Belt and braces: the run step already failed the job
          # on a non-zero exit, but a summary row claiming failures must never coexist with a
          # green step.
          if grep -qE "[0-9]+ of [0-9]+ failed" cypress-plain.txt; then
            echo "::error::Cypress reported failing specs."
            grep -E "[0-9]+ of [0-9]+ failed" cypress-plain.txt
            exit 1
          fi

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-fast-screenshots-${{ matrix.viewport }}
          path: frontend/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v7
        # failure() not always(): a video of a PASSING run is never watched, and these are the
        # largest artifacts in the pipeline. Uploading them on every push is what pushed the
        # artifact API into rate-limiting.
        if: failure()
        with:
          name: cypress-fast-videos-${{ matrix.viewport }}
          path: frontend/cypress/videos
          retention-days: 7

      - name: Upload Cypress JSON results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-fast-results-${{ matrix.viewport }}
          path: frontend/cypress-output.txt
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # Cypress Full E2E — the on-chain money paths (#1028).
  #
  # This tier is the one that proves the PRODUCT works: create, accept, decline, cancel, resolve,
  # claim, refund, freeze, pause, expire — every one driven through the real UI against a real
  # WagerRegistry on a local chain. `fast/**` deliberately never touches a chain, so until this
  # job existed the merge gate could not tell a working money path from a broken one.
  #
  # Why it needs its own job rather than more specs in cypress-fast-e2e: this tier requires a
  # hardhat node, a full contract deploy and a seed, none of which the fast tier wants to pay for.
  # Keeping them separate also keeps the failure legible — a red here means the money path broke,
  # not that a button moved.
  cypress-full-e2e:
    # SHARDED, 4 legs, one private chain each (spec 094). Legal only because per-spec chain
    # isolation (#1222) made specs order-independent — before that, run order decided which specs
    # passed and splitting the list would have changed results, not just wall clock.
    #
    # The split is longest-processing-time-first over measured per-spec seconds
    # (frontend/cypress/coverage/full-tier-weights.json). Balancing spec COUNT would leave the
    # critical path barely shorter than the ~30-minute serial run, because the specs are nowhere
    # near equal.
    #
    # 4, not 8: each leg pays a fixed few minutes of install, compile, node start, deploy and seed.
    # Past 4 that setup dominates and runner minutes grow faster than wall clock falls.
    #
    # MEASURED on the first sharded run (Actions 32204349960): legs of 6:37 / 7:51 / 6:29 / 6:09
    # against a serial total of 1621s (~27 min). That is why this stays on every push — at ~7
    # minutes a leg it is no longer the thing a branch waits on, which was the concern when the
    # only number available was the serial one.
    name: Cypress Full E2E (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # One failing shard must not cancel the others: which OTHER money paths also broke is the
      # first thing anyone reading a red run needs.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # Per-LEG bound, down from the serial job's 60. A leg that should take ~10 minutes must not
    # occupy a runner for an hour before failing; the cap exists to catch a hang, not to
    # accommodate one.
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      # RESTORED BEFORE THE INSTALL, deliberately. Cypress's postinstall checks
      # ~/.cache/Cypress and skips the ~250 MB download when the binary is already there — so a
      # cache step placed after `npm ci` would restore the cache having just paid the cost it
      # exists to avoid.
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: cypress-${{ runner.os }}-

      # ROOT install, unlike cypress-fast-e2e's frontend-only one: this tier drives hardhat
      # (node, compile, deploy, seed), which lives at the root and is deliberately not a
      # workspace member.
      - name: Install dependencies
        run: npm ci

      # Belt and braces: `npm ci` normally installs the binary via cypress's postinstall, but a
      # partial cache or a skipped script leaves the package without it, and `cypress run` then
      # fails deep into the job rather than here.
      - name: Ensure Cypress binary
        run: npx cypress install

      - name: Compile contracts
        run: npx hardhat compile

      # The chain must be ANSWERING before the deploy runs, not merely spawned. Polling
      # eth_chainId is the only honest readiness signal — a fixed sleep either wastes time or
      # races, and a race here surfaces as a confusing deploy error rather than "no chain".
      #
      # Deliberately NO bare `exit 0` on the success path. test/config/CiGates.test.js rejects one
      # in any merge-gating step, and it is right to: `exit 0` is the mechanism that lets a step
      # report success it did not earn, and a reader cannot tell an early return from a swallowed
      # failure by looking. Recording readiness in a variable and failing on its absence says the
      # same thing without the pattern — and falls through to failure by default.
      # AMOY-SHAPED, deliberately (spec 071 collision): membership reads and purchase settlement
      # are pinned to membershipChainId() — Amoy on a testnet cohort — and that constant is
      # deliberately not runtime-configurable. A 1337 node therefore cannot host the membership
      # money path at all (the purchase button is hard-disabled off the membership home). The
      # node impersonates Amoy instead: local deploys are deterministic by deployer+nonce
      # (chain-id-independent), so addresses match the committed hardhat set, and the app maps
      # 80002 to that set through a DEV-only seam (VITE_E2E_AMOY_LOCAL, dead code in any
      # production bundle).
      - name: Start local chain
        run: |
          HARDHAT_LOCAL_CHAIN_ID=80002 npx hardhat node > /tmp/hardhat-node.log 2>&1 &
          ready=""
          for i in $(seq 1 60); do
            if curl -s -X POST http://127.0.0.1:8545 \
                 -H 'content-type: application/json' \
                 --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
                 | grep -q result; then
              ready="$i"
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::Local chain never answered eth_chainId — see the log below."
            cat /tmp/hardhat-node.log
            exit 1
          fi
          echo "chain up after ${ready}s"

      # deploy + sync-frontend-contracts + seed. The seed is what makes the specs' preconditions
      # true (two funded accounts, membership granted, registry approved), so a failure here must
      # stop the job rather than let 95 specs fail one by one for the same reason.
      # setup:e2e, not setup:local: same deploy + seed, minus the frontend-contracts sync — the
      # 80002 mapping comes from the seam above, and the sync would try to rewrite the REAL Amoy
      # address table with local values.
      - name: Deploy and seed the local chain
        run: npm run setup:e2e

      # Constitution IV: this step MUST fail the pipeline on error — no `continue-on-error`.
      # `set -o pipefail` is load-bearing for the same reason it is in cypress-fast-e2e: the
      # command is piped into `tee`, so without it the step's status is tee's (always 0).
      # `dev:e2e`, NOT `dev`. Encryption is mandatory on the create path, and
      # PINATA_CONFIG.USE_PROXY is false outside a production build — so with no VITE_PINATA_JWT
      # getPinataAuthHeaders() THROWS and every wager creation dies before it reaches
      # WagerRegistry. `dev:e2e` supplies a DUMMY value whose only job is to let the request be
      # issued, so the specs' cy.interceptIpfs() can stub it; no bytes leave the runner. It cannot
      # leak into a real bundle — pinataSecretGuard() refuses any production build with it set.
      # The spec list for this leg. Computed once into an env var rather than inline in the run
      # command so the job log shows exactly which specs the leg claimed — a shard that silently
      # ran nothing would otherwise report the same green as one that ran four specs.
      - name: Select this shard's specs
        id: shard
        run: |
          SPECS=$(node scripts/e2e/split-full-tier.js --shards 4 --index ${{ matrix.shard }} --csv)
          if [ -z "$SPECS" ]; then
            echo "::error::Shard ${{ matrix.shard }} resolved to an empty spec list — refusing to report a pass for running nothing."
            exit 1
          fi
          echo "shard ${{ matrix.shard }} specs: $SPECS"
          echo "specs=$SPECS" >> $GITHUB_OUTPUT

      - name: Run full E2E tests
        working-directory: frontend
        run: |
          set -o pipefail
          CYPRESS_NETWORK_ID=80002 npx start-server-and-test dev:e2e http://localhost:5173 \
            'cypress run --spec "${{ steps.shard.outputs.specs }}"' 2>&1 | tee cypress-full-output.txt

      - name: Summarize E2E results
        if: always()
        working-directory: frontend
        run: |
          echo "### Cypress Full E2E — shard ${{ matrix.shard }} (on-chain money paths)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          sed -e 's/\x1b\[[0-9;]*m//g' cypress-full-output.txt > cypress-full-plain.txt
          TOTALS=$(grep -E "(All specs passed!|[0-9]+ of [0-9]+ failed)" cypress-full-plain.txt | tail -1)
          if [ -n "$TOTALS" ]; then
            NUMS=$(echo "$TOTALS" | tr -d '│┌┐└┘─' | sed 's/[✔✖]//g' | grep -oE '[0-9]+|-' | tail -5 | tr '\n' ' ')
            set -- $NUMS
            z () { [ "${1:-}" = "-" ] || [ -z "${1:-}" ] && echo 0 || echo "$1"; }
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Tests | ${1:-?} |" >> $GITHUB_STEP_SUMMARY
            echo "| Passing | $(z "${2:-}") |" >> $GITHUB_STEP_SUMMARY
            echo "| Failing | $(z "${3:-}") |" >> $GITHUB_STEP_SUMMARY
            echo "| Pending | $(z "${4:-}") |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`$(echo "$TOTALS" | tr -d '│' | xargs)\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Cypress produced no run-total row — see the job log." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # Same two-part gate as the fast tier, and for the same reasons documented there: the run
      # step's exit code is authoritative for pass/fail, but it cannot tell us the run never
      # started. Both matches run on the DE-COLOURED copy — cypress wraps "Run Finished" and the
      # totals row in escape codes, so grepping the raw file is a check that cannot fire.
      - name: Check E2E results
        if: always()
        working-directory: frontend
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' cypress-full-output.txt > cypress-full-plain.txt

          if ! grep -qE "Run Finished" cypress-full-plain.txt; then
            echo "::error::Cypress never reached 'Run Finished' — the run died before completing. Failing rather than assuming success."
            exit 1
          fi

          if grep -qE "[0-9]+ of [0-9]+ failed" cypress-full-plain.txt; then
            echo "::error::Cypress reported failing specs in the full (on-chain) tier."
            grep -E "[0-9]+ of [0-9]+ failed" cypress-full-plain.txt
            exit 1
          fi

      - name: Upload chain log
        uses: actions/upload-artifact@v7
        # The chain log is how you tell a reverted transaction from a UI failure, and it is
        # only interesting when something broke.
        if: failure()
        with:
          name: cypress-full-chain-log-${{ matrix.shard }}
          path: /tmp/hardhat-node.log
          retention-days: 7

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-full-screenshots-${{ matrix.shard }}
          path: frontend/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-full-videos-${{ matrix.shard }}
          path: frontend/cypress/videos
          retention-days: 7

      - name: Upload Cypress output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-full-results-${{ matrix.shard }}
          path: frontend/cypress-full-output.txt
          retention-days: 7
