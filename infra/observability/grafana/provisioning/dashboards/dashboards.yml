# Dashboard provisioning (spec 088).
apiVersion: 1

providers:
  - name: fairwins
    orgId: 1
    folder: FairWins
    type: file
    # False: a provisioned dashboard deleted in the UI stays deleted until the next restart, rather
    # than reappearing mid-session and looking like a bug.
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
