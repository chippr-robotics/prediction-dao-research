# OS hardening (spec 087, US3, FR-018).
#
# Separately invocable via playbooks/harden.yml so that OS-level change is a deliberate act rather
# than a side effect of a routine converge run.
---
- name: Disable SSH password authentication
  # The nodes are reachable only through IAP, which already authenticates — but a password-accepting
  # sshd is one firewall mistake away from being brute-forceable.
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  notify: restart sshd

- name: Disable direct root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  notify: restart sshd

- name: Apply kernel hardening parameters
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: net.ipv4.conf.all.accept_redirects, value: "0" }
    - { name: net.ipv4.conf.all.send_redirects, value: "0" }
    - { name: net.ipv4.conf.all.accept_source_route, value: "0" }
    - { name: net.ipv4.tcp_syncookies, value: "1" }
    - { name: kernel.dmesg_restrict, value: "1" }
    # /proc/<pid>/cmdline is world-readable, which is why the secret scripts refuse to pass values
    # on argv. hidepid would be stronger still but breaks the Ops Agent's process metrics.
    - { name: kernel.yama.ptrace_scope, value: "1" }
  become: true

- name: Install unattended-upgrades for security patches only
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  become: true

- name: Restrict unattended-upgrades to the security archive
  # Docker is held (see the docker role), so a security-only policy cannot bump the engine.
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51fairwins-unattended
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible (spec 087). Security updates only; docker-ce is held separately.
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
  become: true

- name: Enforce ownership and permissions on the Cloudflare origin key
  # This key is commonly pasted in by hand and lands 0644 by default. A world-readable origin key
  # lets any local process impersonate this origin to Cloudflare, so it is enforced on every run
  # rather than relying on the operator remembering.
  ansible.builtin.file:
    path: "{{ fairwins_ssl_dir }}/origin.key"
    owner: root
    group: root
    mode: "0600"
  become: true
  failed_when: false
