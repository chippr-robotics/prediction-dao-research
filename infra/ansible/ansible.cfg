# Ansible configuration for the FairWins nodes (spec 085).
[defaults]
inventory            = inventory/gcp.yml
roles_path           = roles
collections_path     = collections
host_key_checking    = False
stdout_callback      = yaml
# Show what changed, and only what changed — the idempotency claim (SC-005) is only meaningful if a
# reviewer can see a run's diff.
callbacks_enabled    = profile_tasks
interpreter_python   = /usr/bin/python3
retry_files_enabled  = False
# A secret must never reach the log even on failure. Individual tasks also set no_log; this is the
# backstop.
display_skipped_hosts = False

[ssh_connection]
# The nodes are reachable ONLY through IAP TCP forwarding (the firewall opens :22 to
# 35.235.240.0/20 alone). The proxy command lives in the inventory so it travels with the hosts.
pipelining = True
