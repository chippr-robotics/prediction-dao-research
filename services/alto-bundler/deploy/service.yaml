# ⚠ DECOMMISSIONED, AND IT MUST STAY THAT WAY (spec 087 guardrail G-11).
#
# `fairwins-alto-bundler` was deleted from Cloud Run when the bundler moved to GCE; verified absent
# from `gcloud run services list` 2026-08-23. It is deliberately NOT declared in Terraform, and
# `npm run check:iac` rejects any attempt to add it back — a second bundler against the VM
# bundler's EOA means colliding nonces and stuck bundles, with both instances reporting healthy and
# no in-band detection.
#
# This file is the reconciliation record, kept in step with infra/vm/bundler/docker-compose.yml so
# it stays a truthful description. Do NOT `gcloud run services replace` it.
#
# Cloud Run multi-container service: origin-lock nginx ingress + alto ERC-4337 bundler sidecar.
# Spec 041 SC-009 / spec 036 FR-029: put the bundler behind the same origin lock as the SPA + gateway.
#
# INGRESS container = nginx (the only one with a `ports:` entry — receives all traffic on 8080).
# SIDECAR  container = alto  (localhost-only; nginx proxies to 127.0.0.1:3000).
#
# The `alto` container below is RECONCILED to the live service (`fairwins-alto-bundler`, alto v1.2.7,
# Polygon 137) as of 2026-07-06 — image, all ALTO_* env, and the executor-key secret ref match what
# was running standalone, so flipping to this 2-container spec changes ONLY the ingress path, never the
# bundler's runtime. Applied via `gcloud run services replace` (a single-container `gcloud run deploy`
# would drop the alto sidecar).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fairwins-alto-bundler
  labels:
    app: fairwins-alto-bundler
  annotations:
    run.googleapis.com/launch-stage: BETA          # multi-container (sidecars) is BETA-gated
    run.googleapis.com/ingress: all                # Cloudflare fronts it; the origin lock is the gate
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/container-dependencies: '{"nginx":["alto"]}'  # start alto before nginx
        # minScale 1 keeps one instance warm so a member's first UserOp does not wait on alto's
        # ~8-13s boot. It is NOT what preserves executor nonce continuity (the earlier comment here
        # said so and was wrong): alto re-reads the executor nonce from chain on every boot, and the
        # instance is in fact replaced ~194x/30d by min-instance churn and redeploys.
        autoscaling.knative.dev/minScale: "1"
        # PINNED TO 1 — SAFETY, NOT COST. ALTO_EXECUTOR_PRIVATE_KEYS and ALTO_UTILITY_PRIVATE_KEY
        # both resolve to the SAME secret (alto-executor-key-137), so a second instance would run a
        # second executor against the same EOA and collide on nonces. Do not raise this without
        # giving each instance its own executor key.
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"     # bundler must keep processing between requests
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: 266380754692-compute@developer.gserviceaccount.com
      containers:
        # ---- Ingress: origin-lock nginx (validates Cloudflare's X-Origin-Auth) ----
        - name: nginx
          image: us-central1-docker.pkg.dev/chippr-bots-site-wp/cloud-run-source-deploy/alto-bundler-nginx:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            # Origin lock ARMED (2026-07-06): bundler.fairwins.app routes correctly (Cloudflare Host
            # override to the *.run.app origin) and the SPA points at bundler.fairwins.app, so the header
            # is present on every real request. Same secret Cloudflare injects as X-Origin-Auth zone-wide.
            # Fail-open: drop this ref and the lock disables itself rather than 403-bricking the bundler.
            - name: ORIGIN_LOCK_SECRET
              valueFrom:
                secretKeyRef:
                  name: origin-lock-secret
                  key: latest
          # Right-sized 2026-08-02. nginx only validates one header and proxies to localhost at a
          # measured 13 req/day median; 1 full vCPU was ~10x the p99. Instance CPU total must be a
          # supported Cloud Run value (1/2/4/6/8) -> 150m + 850m = exactly 1.
          resources:
            limits:
              cpu: "150m"
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 10
            periodSeconds: 3
        # ---- Sidecar: alto bundler (localhost only; reconciled to live v1.2.7 / Polygon 137) ----
        - name: alto
          image: us-central1-docker.pkg.dev/chippr-bots-site-wp/cloud-run-source-deploy/alto:v1.2.7
          env:
            - name: ALTO_ENTRYPOINTS
              value: "0x5FF137D4b0FDCD49DcA30c7CF57E578a026d2789"   # EntryPoint v0.6
            # Switched off publicnode 2026-07-12: its free tier began 403-ing archive requests
            # ("Archive requests require a personal token"), which broke ERC-4337 receipt
            # resolution (eth_getLogs for UserOperationEvent) — ops mined but confirmations never
            # surfaced, and the receipt-poll 403 flood degraded the send path (bundles stopped
            # broadcasting; executor nonce froze). The stopgap was QuickNode's TOKENLESS shared
            # endpoint (https://rpc-mainnet.matic.quiknode.pro), which serves archive getLogs as a
            # courtesy with no quota we control.
            #
            # 2026-08-23: moved to the KEYED endpoint. Its token is in the URL path, so the value
            # is a secret reference rather than a literal — the same thing the VM does by reading
            # QUICKNODE_POLYGON_API into alto.env. alto takes ONE endpoint and has no failover, so
            # if the secret cannot be read the container must not start.
            - name: ALTO_RPC_URL
              valueFrom:
                secretKeyRef: { name: QUICKNODE_POLYGON_API, key: latest }
            - name: ALTO_SAFE_MODE
              value: "false"
            - name: ALTO_PORT
              value: "3000"
            - name: ALTO_API_VERSION
              value: "v1,v2"
            - name: ALTO_NETWORK_NAME
              value: "polygon"
            - name: ALTO_DEPLOY_SIMULATIONS_CONTRACT
              # MUST be true on Polygon (verified 2026-07-12). With false, alto v1.2.7's bundle-build
              # (filterOps) references a simulations contract that isn't deployed and throws a swallowed
              # error BEFORE any broadcast — ops pass validation/estimation (v0.6 built-in sim) but the
              # executor never sends the bundle, so its nonce freezes and every UserOp times out. With
              # true, alto deploys its own version-matched sim contract via the funded utility wallet and
              # bundles land (confirmed: handleOps 0x95ca0cc0…, block 90119266). Do NOT set false: an
              # earlier `services replace` applying a stale false silently re-broke the bundler.
              value: "true"
            - name: ALTO_GAS_PRICE_MULTIPLIERS
              # slow,standard,fast multipliers (%) on the computed gas price (default 100,100,100).
              # Polygon public RPCs report a stale ~25-30 gwei eth_maxPriorityFeePerGas even under heavy
              # congestion (real p50 has hit 110-135 gwei), so alto underprices ops/bundles and the
              # executor can't get them included. These multipliers lift the suggestion to ~100/125/150
              # gwei priority so bundles land during spikes. Revisit if Polygon fees normalize or we move
              # to an RPC with an accurate fee oracle. Added 2026-07-13.
              value: "400,500,600"
            - name: ALTO_EXECUTOR_PRIVATE_KEYS
              valueFrom:
                secretKeyRef:
                  name: alto-executor-key-137
                  key: latest
            - name: ALTO_UTILITY_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: alto-executor-key-137
                  key: latest
          # Right-sized 2026-08-02: measured 30d p99 was 0.358 vCPU / 0.261 GiB across the whole
          # instance, so 850m + 896Mi keeps ~2.4x CPU and ~3.4x memory headroom. cpu-throttling
          # stays "false" — alto returns userOpHash immediately and broadcasts the bundle AFTER the
          # response, so it must keep CPU between requests. Revert to "1" if p99 exceeds 0.8 vCPU.
          resources:
            limits:
              cpu: "850m"
              memory: 896Mi
          # Required by Cloud Run because nginx `depends_on` alto (container-dependencies): the
          # dependency ordering gates nginx startup on alto's port being live. TCP probe on alto's
          # ALTO_PORT (3000); no HTTP health route exists on alto (GET / 404s).
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 3
            failureThreshold: 20
            timeoutSeconds: 3
