specVersion: 0.0.5
description: v2 WagerRegistry wagers + per-transfer records and membership
  vouchers (spec 026) for the prediction-dao-research app
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: WagerRegistry
    network: matic
    source:
      abi: WagerRegistry
      address: "0xE878b62887fC8A5F739B8Ce61bC19546A280Ef89"
      startBlock: 89717915
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Wager
        - WagerTransfer
      abis:
        - name: WagerRegistry
          file: ../node_modules/@fairwins/abi/json/WagerRegistry.json
      eventHandlers:
        - event: WagerCreated(indexed uint256,indexed address,indexed
            address,address,uint128,uint128,uint8,bytes32,string)
          handler: handleWagerCreated
        - event: OpenWagerCreated(indexed uint256,indexed address,indexed
            address,address,uint128,uint8,bytes32,string)
          handler: handleOpenWagerCreated
        - event: WagerAccepted(indexed uint256,indexed address)
          handler: handleWagerAccepted
        - event: PayoutClaimed(indexed uint256,indexed address,uint256)
          handler: handlePayoutClaimed
        - event: WagerRefunded(indexed uint256,indexed address,indexed address)
          handler: handleWagerRefunded
        - event: WagerDrawn(indexed uint256,indexed address,indexed address,address)
          handler: handleWagerDrawn
        - event: WagerCancelled(indexed uint256)
          handler: handleWagerCancelled
        - event: WagerResolved(indexed uint256,indexed address,indexed address)
          handler: handleWagerResolved
        - event: WagerDeclined(indexed uint256,indexed address)
          handler: handleWagerDeclined
        - event: DrawProposed(indexed uint256,indexed address)
          handler: handleDrawProposed
        - event: DrawRevoked(indexed uint256,indexed address)
          handler: handleDrawRevoked
      file: ./src/mappings/wagerRegistry.ts
  - kind: ethereum
    name: MembershipVoucher
    network: matic
    source:
      abi: MembershipVoucher
      address: "0xCB28DC438564672067a6f84131B5130e6Cf7ECC6"
      startBlock: 89717905
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Voucher
      abis:
        - name: MembershipVoucher
          file: ../node_modules/@fairwins/abi/json/MembershipVoucher.json
      eventHandlers:
        - event: VoucherMinted(indexed uint256,indexed address,indexed
            bytes32,uint8,uint32,uint128)
          handler: handleVoucherMinted
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
      file: ./src/mappings/membershipVoucher.ts
  - kind: ethereum
    name: MembershipManager
    network: matic
    source:
      abi: MembershipManager
      address: "0xEfd1a880c6BfBf38A661A3F5fF6d5ECB296D557a"
      startBlock: 89717895
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Voucher
      abis:
        - name: MembershipManager
          file: ../node_modules/@fairwins/abi/json/MembershipManager.json
      eventHandlers:
        - event: MembershipRedeemed(indexed address,indexed bytes32,uint8,indexed
            uint256,uint64)
          handler: handleMembershipRedeemed
      file: ./src/mappings/membershipVoucher.ts
  - kind: ethereum
    name: ChainlinkDataFeedOracleAdapter
    network: matic
    source:
      abi: ChainlinkDataFeedOracleAdapter
      address: "0x7ae8220Dc02D0504EDCBa2C1B1AbA579AA3F0f23"
      startBlock: 87937162
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - OracleCondition
        - OracleMarketLink
      abis:
        - name: ChainlinkDataFeedOracleAdapter
          file: ../node_modules/@fairwins/abi/json/ChainlinkDataFeedOracleAdapter.json
      eventHandlers:
        - event: ConditionRegistered(indexed bytes32,string,uint256)
          handler: handleDataFeedConditionRegistered
        - event: MarketLinked(indexed uint256,indexed bytes32)
          handler: handleDataFeedMarketLinked
        - event: ConditionResolved(indexed bytes32,bool,uint256,uint256)
          handler: handleDataFeedConditionResolved
      file: ./src/mappings/oracleAdapters.ts
  - kind: ethereum
    name: ChainlinkFunctionsOracleAdapter
    network: matic
    source:
      abi: ChainlinkFunctionsOracleAdapter
      address: "0x148C2E347a601AC1a680b17321529b0Ffc31AeFc"
      startBlock: 87937176
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - OracleCondition
        - OracleMarketLink
      abis:
        - name: ChainlinkFunctionsOracleAdapter
          file: ../node_modules/@fairwins/abi/json/ChainlinkFunctionsOracleAdapter.json
      eventHandlers:
        - event: ConditionRegistered(indexed bytes32,string,uint256)
          handler: handleFunctionsConditionRegistered
        - event: MarketLinked(indexed uint256,indexed bytes32)
          handler: handleFunctionsMarketLinked
        - event: ConditionResolved(indexed bytes32,bool,uint256,uint256)
          handler: handleFunctionsConditionResolved
      file: ./src/mappings/oracleAdapters.ts
  - kind: ethereum
    name: UMAOptimisticOracleV3Adapter
    network: matic
    source:
      abi: UMAOptimisticOracleV3Adapter
      address: "0x8224433d099Af6cd30540A78421aBFd6e044E949"
      startBlock: 87937184
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - OracleCondition
        - OracleMarketLink
      abis:
        - name: UMAOptimisticOracleV3Adapter
          file: ../node_modules/@fairwins/abi/json/UMAOptimisticOracleV3Adapter.json
      eventHandlers:
        - event: ConditionRegistered(indexed bytes32,string,uint256)
          handler: handleUmaConditionRegistered
        - event: MarketLinked(indexed uint256,indexed bytes32)
          handler: handleUmaMarketLinked
        - event: ConditionResolved(indexed bytes32,bool,uint256,uint256)
          handler: handleUmaConditionResolved
      file: ./src/mappings/oracleAdapters.ts
  - kind: ethereum
    name: TokenFactory
    network: matic
    source:
      abi: TokenFactory
      address: "0x5806e76cA3c838524E7cF43db7625bdFBA0783a0"
      startBlock: 89717942
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Token
      abis:
        - name: TokenFactory
          file: ../node_modules/@fairwins/abi/json/TokenFactory.json
      eventHandlers:
        - event: TokenCreated(indexed uint256,indexed uint8,indexed
            address,address,string,string)
          handler: handleTokenCreated
      file: ./src/mappings/tokenFactory.ts
  - kind: ethereum
    name: WagerPoolFactory
    network: matic
    source:
      abi: WagerPoolFactory
      address: "0x420aEC3c76859eB74ab21c769c16AcdAB221f723"
      startBlock: 89720740
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - PoolAllowedToken
      abis:
        - name: WagerPoolFactory
          file: ../node_modules/@fairwins/abi/json/WagerPoolFactory.json
      eventHandlers:
        - event: PoolCreated(indexed uint256,indexed address,indexed
            address,uint32[4],address,uint256,uint32,uint16,uint64,uint64)
          handler: handlePoolCreated
        - event: TokenAllowed(indexed address,bool)
          handler: handleTokenAllowed
      file: ./src/mappings/wagerPoolFactory.ts
templates:
  - kind: ethereum/contract
    name: TokenInstance
    network: matic
    source:
      abi: TokenInstance
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Holder
        - TokenActivity
      abis:
        - name: TokenInstance
          file: ../node_modules/@fairwins/abi/json/TokenInstance.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: Paused(address)
          handler: handlePaused
        - event: Unpaused(address)
          handler: handleUnpaused
        - event: Frozen(indexed address,bool)
          handler: handleFrozen
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
      file: ./src/mappings/token.ts
  - kind: ethereum/contract
    name: WagerPool
    network: matic
    source:
      abi: WagerPool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - PoolMember
        - PoolProposal
        - PoolPayoutEntry
        - PoolApproval
        - PoolClaim
        - PoolRefund
      abis:
        - name: WagerPool
          file: ../node_modules/@fairwins/abi/json/WagerPool.json
      eventHandlers:
        - event: Joined(indexed address)
          handler: handleJoined
        - event: JoiningClosedEvent(uint32)
          handler: handleJoiningClosed
        - event: OutcomeProposed(indexed bytes32,(address,uint256)[])
          handler: handleOutcomeProposed
        - event: Approved(indexed bytes32,indexed address)
          handler: handleApproved
        - event: OutcomeLocked(indexed bytes32)
          handler: handleOutcomeLocked
        - event: Claimed(indexed address,address,uint256)
          handler: handleClaimed
        - event: Refunded(indexed address,uint256)
          handler: handleRefunded
        - event: PoolCancelled()
          handler: handlePoolCancelled
      file: ./src/mappings/wagerPool.ts
